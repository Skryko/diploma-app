name: Build and Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: cr.yandex
  REGISTRY_ID: crpvgs42tbh16im42p7a
  IMAGE_NAME: diploma-app
  K8S_NAMESPACE: default
  K8S_DEPLOYMENT: diploma-app
  YC_SG_ID: enpc51tssafdu7pisaf7
  YC_BIN: ${{ github.workspace }}/yandex-cloud/bin/yc

jobs:
  build:
    name: Build & Push image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.9.1

      - name: Login to Yandex Container Registry
        run: |
          echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login \
            --username json_key \
            --password-stdin ${{ env.REGISTRY }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            APP_BUILD=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to Kubernetes
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl and yc
        run: |
          KUBECTL_VERSION="$(curl -sSL https://dl.k8s.io/release/stable.txt)"
          curl -sSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | \
            bash -s -- -i "$GITHUB_WORKSPACE/yandex-cloud" -n > /dev/null
          "$GITHUB_WORKSPACE/yandex-cloud/bin/yc" version

      - name: Authorize runner IP in YC SG
        id: authorize
        env:
          YC_KEY: ${{ secrets.YC_SA_KEY_JSON }}
        run: |
          printf '%s' "$YC_KEY" > /tmp/sa-key.json
          chmod 600 /tmp/sa-key.json
          "$GITHUB_WORKSPACE/yandex-cloud/bin/yc" config set service-account-key /tmp/sa-key.json
          "$GITHUB_WORKSPACE/yandex-cloud/bin/yc" config list

          RUNNER_IP=$(curl -4 -sSL https://api.ipify.org)
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

          "$GITHUB_WORKSPACE/yandex-cloud/bin/yc" vpc security-group update-rules "${{ env.YC_SG_ID }}" \
            --add-rule "direction=ingress,port=6443,protocol=tcp,v4-cidrs=$RUNNER_IP/32"
          echo "Waiting for SG propagation..."
          sleep 20

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo '${{ secrets.KUBE_CONFIG_B64 }}' | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      - name: Apply manifests
        run: |
          kubectl apply -f deploy/k8s/deployment.yaml
          kubectl apply -f deploy/k8s/service.yaml
          kubectl apply -f deploy/k8s/ingress.yaml

      - name: Set new image
        run: |
          IMAGE="${REGISTRY}/${REGISTRY_ID}/${IMAGE_NAME}:${{ needs.build.outputs.tag }}"
          echo "Deploying image: $IMAGE"
          kubectl -n "${K8S_NAMESPACE}" set image \
            "deployment/${K8S_DEPLOYMENT}" \
            "diploma-app=${IMAGE}"

      - name: Wait rollout
        run: |
          kubectl -n "${K8S_NAMESPACE}" rollout status \
            "deployment/${K8S_DEPLOYMENT}" --timeout=180s
          kubectl -n "${K8S_NAMESPACE}" get pods -l app.kubernetes.io/name=diploma-app -o wide

      - name: Cleanup SG rule
        if: always()
        env:
          YC_KEY: ${{ secrets.YC_SA_KEY_JSON }}
        run: |
          if [ ! -x "$GITHUB_WORKSPACE/yandex-cloud/bin/yc" ]; then
            echo "yc not installed, skipping cleanup"
            exit 0
          fi
          printf '%s' "$YC_KEY" > /tmp/sa-key.json
          chmod 600 /tmp/sa-key.json
          "$GITHUB_WORKSPACE/yandex-cloud/bin/yc" config set service-account-key /tmp/sa-key.json

          RUNNER_IP="${{ steps.authorize.outputs.runner_ip }}"
          if [ -z "$RUNNER_IP" ]; then
            echo "No runner IP to clean up"
            exit 0
          fi

          RULE_ID=$("$GITHUB_WORKSPACE/yandex-cloud/bin/yc" vpc security-group get "${{ env.YC_SG_ID }}" --format json | \
            jq -r --arg ip "$RUNNER_IP/32" \
              '[.rules[] | select(.direction=="INGRESS" and .ports.from_port==6443 and ((.cidr_blocks.v4_cidr_blocks // []) | index($ip)))] | first | .id // empty')
          if [ -n "$RULE_ID" ]; then
            echo "Deleting SG rule $RULE_ID for $RUNNER_IP"
            "$GITHUB_WORKSPACE/yandex-cloud/bin/yc" vpc security-group update-rules "${{ env.YC_SG_ID }}" --delete-rule-id "$RULE_ID"
          else
            echo "No matching rule found for $RUNNER_IP"
          fi
