name: Build and Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: cr.yandex
  REGISTRY_ID: crpvgs42tbh16im42p7a
  IMAGE_NAME: diploma-app
  K8S_NAMESPACE: default
  K8S_DEPLOYMENT: diploma-app
  YC_SG_ID: enpc51tssafdu7pisaf7

jobs:
  build:
    name: Build & Push image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.9.1

      - name: Login to Yandex Container Registry
        run: |
          echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login \
            --username json_key \
            --password-stdin ${{ env.REGISTRY }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            APP_BUILD=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to Kubernetes
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      YC_SERVICE_ACCOUNT_KEY_FILE: /tmp/sa-key.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl and yc
        run: |
          KUBECTL_VERSION="$(curl -sSL https://dl.k8s.io/release/stable.txt)"
          curl -sSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | \
            bash -s -- -i "$HOME/yandex-cloud" -n > /dev/null
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Authorize runner IP in YC SG
        id: authorize
        env:
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          echo '${{ secrets.YC_SA_KEY_JSON }}' > /tmp/sa-key.json
          chmod 600 /tmp/sa-key.json

          RUNNER_IP=$(curl -4 -sSL https://api.ipify.org)
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

          RULE="direction=ingress,port=6443,protocol=tcp,v4-cidr-blocks=$RUNNER_IP/32"
          echo "rule=$RULE" >> "$GITHUB_OUTPUT"

          yc vpc security-group update-rules ${{ env.YC_SG_ID }} --add-rule "$RULE"
          echo "Waiting for SG propagation..."
          sleep 20

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo '${{ secrets.KUBE_CONFIG_B64 }}' | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      - name: Apply manifests
        run: |
          kubectl apply -f deploy/k8s/deployment.yaml
          kubectl apply -f deploy/k8s/service.yaml
          kubectl apply -f deploy/k8s/ingress.yaml

      - name: Set new image
        run: |
          IMAGE="${REGISTRY}/${REGISTRY_ID}/${IMAGE_NAME}:${{ needs.build.outputs.tag }}"
          echo "Deploying image: $IMAGE"
          kubectl -n "${K8S_NAMESPACE}" set image \
            "deployment/${K8S_DEPLOYMENT}" \
            "diploma-app=${IMAGE}"

      - name: Wait rollout
        run: |
          kubectl -n "${K8S_NAMESPACE}" rollout status \
            "deployment/${K8S_DEPLOYMENT}" --timeout=180s
          kubectl -n "${K8S_NAMESPACE}" get pods -l app.kubernetes.io/name=diploma-app -o wide

      - name: Cleanup SG rule
        if: always()
        env:
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          echo '${{ secrets.YC_SA_KEY_JSON }}' > /tmp/sa-key.json
          chmod 600 /tmp/sa-key.json
          yc vpc security-group update-rules ${{ env.YC_SG_ID }} \
            --delete-rule "${{ steps.authorize.outputs.rule }}" || true
